[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "saloon-backend"
version = "0.1.0"
description = "Saloon Booking Platform API"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {version = "^0.32", extras = ["standard"]}
pydantic = "^2.9"
pydantic-settings = "^2.6"
sqlalchemy = {version = "^2.0.36", extras = ["asyncio"]}
asyncpg = "^0.30"
alembic = "^1.14"
redis = "^5.2"
celery = "^5.4"
python-jose = {version = "^3.3", extras = ["cryptography"]}
passlib = {version = "^1.7", extras = ["bcrypt"]}
python-multipart = "^0.0.12"
email-validator = "^2.2"
httpx = "^0.27"
resend = "^2.4"
python-ulid = "^3.0"
structlog = "^24.4"
slowapi = "^0.1.9"
psycopg2-binary = "^2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
ruff = "^0.7"
black = "^24.10"
mypy = "^1.13"
faker = "^33.0"
httpx = "^0.27"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 85
