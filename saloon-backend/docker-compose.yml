version: "3.9"

# Infrastructure only — the API runs manually (see README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: saloon
      POSTGRES_PASSWORD: saloon
      POSTGRES_DB: saloon
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saloon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
